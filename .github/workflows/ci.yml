name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-cpu
            runs_on: ubuntu-latest
          - name: macos-arm
            runs_on: macos-14
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NDM_SOFTWARE_CONDA_ENV: jax_cpu
      NDM_STRICT_BACKEND_TESTS: "true"
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: cjerzak/ndm-datasets
          path: ndm-datasets

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniforge-variant: Miniforge3
          use-mamba: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: |
          install.packages(
            c(
              "remotes",
              "reticulate",
              "testthat",
              "yaml",
              "fastmatch",
              "progress",
              "rrapply",
              "zip",
              "zoo"
            ),
            repos = "https://cloud.r-project.org"
          )

      - name: Install ndmdatasets
        shell: Rscript {0}
        run: |
          remotes::install_local("ndm-datasets", dependencies = TRUE, upgrade = "never")

      - name: Install ndm
        shell: Rscript {0}
        run: |
          remotes::install_local(".", dependencies = TRUE, upgrade = "never")

      - name: Provision backend
        shell: Rscript {0}
        run: |
          ndm::ndm_build_backend(
            conda_env = Sys.getenv("NDM_SOFTWARE_CONDA_ENV"),
            include_tensorflow = TRUE
          )

      - name: Run testthat
        shell: Rscript {0}
        run: |
          options(warn = 1)
          testthat::test_local(stop_on_failure = TRUE)
